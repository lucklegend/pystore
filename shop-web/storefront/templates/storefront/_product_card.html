<a class="card product-card" href="{% url 'storefront:product_detail' product.id %}">
  <div class="product-image">
    {% if product.image_url %}<img src="{{ product.image_url }}" alt="" loading="lazy">{% else %}<span aria-hidden="true">{{ product.name|slice:":1" }}</span>{% endif %}
  </div>
  <div class="card-body">
    {% if product.category_name %}<p class="eyebrow">{{ product.category_name }}</p>{% endif %}
    <h3>{{ product.name }}</h3>
    <p class="price">${{ product.price }}</p>
    {% if product.stock == 0 %}<p class="muted small">Out of stock</p>{% endif %}
  </div>
</a>
